@if (loading()) {
  <p>Loading profile...</p>
} @else if (profile(); as p) {
  <div class="overview-layout">
    <!-- Form column -->
    <div class="form-column">
      <form [formGroup]="form" (ngSubmit)="onSave()">
        <mat-form-field appearance="outline">
          <mat-label>Display Name</mat-label>
          <input matInput formControlName="legalName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Headline</mat-label>
          <input matInput formControlName="tagline" placeholder="e.g., Senior SOC 2 Assessor" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>About</mat-label>
          <textarea matInput formControlName="shortDescription" rows="5"></textarea>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
          @if (saving()) {
            Saving...
          } @else {
            Save Profile
          }
        </button>
      </form>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar-column">
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="avatar-preview">
            <div class="avatar-circle">
              @if (p.logoUrl) {
                <img [src]="p.logoUrl" [alt]="p.legalName" />
              } @else {
                <span>{{ initials() }}</span>
              }
            </div>
          </div>

          <!-- Provider aggregate stats (rating / review-count / jobs-completed) removed:
               the org-scoped ProviderDetailView dropped these denormalized fields by design.
               Backlog: re-source from Review aggregates on read (errata-044 follow-up). -->
        </mat-card-content>
      </mat-card>
    </aside>
  </div>
} @else {
  <p>No profile found. Create a provider profile to get started.</p>
}
